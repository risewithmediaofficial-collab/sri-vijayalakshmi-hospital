services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-svlh}-frontend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-svlh}_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-94}:80"
    depends_on:
      - backend
    networks:
      - svlh_net

  mongo:
    image: mongo:7.0
    container_name: ${COMPOSE_PROJECT_NAME:-svlh}_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-svlh_hospital_db}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27027}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - svlh_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-svlh}-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-svlh}_backend
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5011
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/svlh_hospital_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:94}
      JWT_SECRET: ${JWT_SECRET:-svlh_production_jwt_secret_key_2026_x89_hospital_grade}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-svlh_production_refresh_token_secret_key_2026_x89}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-aHBtYnNfYWVzMjU2X2VuY3J5cHRpb25fa2V5XzMyYiE=}
      SEARCH_HASH_KEY: ${SEARCH_HASH_KEY:-svlh_search_hash_secret_key_2026_production_safe_key_32b}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@srivijayalakshmihospital.com}
      SUPER_ADMIN_BOOTSTRAP_PASSWORD: ${SUPER_ADMIN_BOOTSTRAP_PASSWORD:-SuperAdmin@2026!}
    ports:
      - "${BACKEND_PORT:-5011}:5011"
    expose:
      - "5011"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - svlh_net

networks:
  svlh_net:
    driver: bridge

volumes:
  mongo_data:
    name: ${COMPOSE_PROJECT_NAME:-svlh}_mongo_data
