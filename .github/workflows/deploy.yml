name: Sri Vijaya Lakshmi Hospital — Deployment Workflow

on:
  push:
    branches: [ main, master, test ]
  pull_request:
    branches: [ main, master, test ]

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js with NPM Caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Fast Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-production:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 180s
          command_timeout: 20m
          script: |
            DEPLOY_DIR="/docker/svlh-hospital"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p /docker
              rm -rf "$DEPLOY_DIR"
              git clone -b main https://github.com/risewithmediaofficial-collab/sri-vijayalakshmi-hospital.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main || git fetch origin master || true
            git checkout main || git checkout master || true
            git reset --hard origin/main || git reset --hard origin/master || true

            # Ensure .env exists with Production configuration on port 94, 5011, 27027
            echo "COMPOSE_PROJECT_NAME=svlh" > .env
            echo "FRONTEND_PORT=94" >> .env
            echo "BACKEND_PORT=5011" >> .env
            echo "MONGO_PORT=27027" >> .env
            echo "NODE_ENV=production" >> .env
            echo "MONGO_INITDB_DATABASE=svlh_hospital_db" >> .env
            echo "MONGO_URI=mongodb://mongo:27017/svlh_hospital_db" >> .env
            echo "CORS_ORIGIN=*" >> .env
            echo "PUBLIC_APP_URL=http://localhost:94" >> .env
            echo "JWT_SECRET=svlh_production_jwt_secret_key_2026_x89_hospital_grade" >> .env
            echo "JWT_EXPIRES_IN=7d" >> .env
            echo "REFRESH_TOKEN_SECRET=svlh_production_refresh_token_secret_key_2026_x89" >> .env
            echo "REFRESH_TOKEN_EXPIRES_IN=30d" >> .env
            echo "FIELD_ENCRYPTION_KEY=aHBtYnNfYWVzMjU2X2VuY3J5cHRpb25fa2V5XzMyYiE=" >> .env
            echo "SEARCH_HASH_KEY=svlh_search_hash_secret_key_2026_production_safe_key_32b" >> .env
            echo "EMAIL_PROVIDER=console" >> .env
            echo "EMAIL_FROM=noreply@srivijayalakshmihospital.com" >> .env
            echo "SUPER_ADMIN_BOOTSTRAP_PASSWORD=SuperAdmin@2026!" >> .env

            (docker compose down --remove-orphans || true)

            # Auto-cleanup any orphan container occupying port 94
            OLD_CONTAINER=$(docker ps -q --filter "publish=94")
            if [ -n "$OLD_CONTAINER" ]; then
              echo "Cleaning up container occupying port 94: $OLD_CONTAINER"
              docker stop $OLD_CONTAINER || true
              docker rm $OLD_CONTAINER || true
            fi

            (docker compose up -d --build --remove-orphans) || (docker-compose up -d --build --remove-orphans)
            echo "✅ Sri Vijaya Lakshmi Hospital deployment completed successfully at $DEPLOY_DIR on port 94"
